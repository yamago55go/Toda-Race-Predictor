name: Toda Race Data

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: '出走表PDFのURL'
        required: false
        type: string
  schedule:
    - cron: '35 11 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python libraries
        run: python3 -m pip install beautifulsoup4 requests pdfplumber

      - name: Fetch Toda race PDF
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: python3 scripts/fetch_pdf.py --pdf-url "$PDF_URL"

      - name: Save fetched data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update Toda race PDF data"
            git push
          fi
